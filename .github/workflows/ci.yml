name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/NoDoxx.sln

      - name: Build solution
        run: >
          msbuild src/NoDoxx.sln
          /p:Configuration=Release
          /p:Platform=x64
          /m
          /verbosity:minimal

      - name: Run tests
        run: >
          dotnet test src/NoDoxx.UnitTests/NoDoxx.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
